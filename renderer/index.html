<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OverlayIA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <video id="bg" muted playsinline></video>
  <canvas id="glass"></canvas>
  <div id="fps" style="display:none"></div>

  <div class="stage">
    <main class="card" id="card">
      <div class="chat" id="chat"></div>
      <div class="tray" id="tray" hidden></div>

      <div class="row">
        <input id="input" placeholder="Demander n'importe quoi..." autocomplete="off" spellcheck="false">
        <button class="ibtn ghost" id="settingsBtn" title="Paramètres">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <button class="ibtn ghost" id="mic" title="Dicter">
          <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button class="ibtn primary" id="send" title="Envoyer">
          <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>

      <section class="image-options" id="imageOptions" aria-label="Réglages de génération">
        <div class="image-settings-row">
          <div class="image-setting-wrap">
            <button class="pill image-setting-btn" type="button" data-image-popover="resolution"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg><span class="image-setting-label">Résolution</span><span id="resolutionSummary">1024 × 1024</span></button>
            <div class="image-popover" id="popover-resolution" hidden>
              <label class="image-field">Format
                <select id="imageFormat">
                  <option value="1024x1024">Carré · 1024 × 1024</option>
                  <option value="832x1216">Portrait · 832 × 1216</option>
                  <option value="1216x832">Paysage · 1216 × 832</option>
                  <option value="768x1024">Portrait · 768 × 1024</option>
                  <option value="1024x768">Paysage · 1024 × 768</option>
                  <option value="custom">Personnalisé</option>
                </select>
              </label>
              <div class="image-dimensions">
                <label class="image-field">Largeur<input id="imageWidth" type="number" min="512" max="1536" step="8" value="1024"></label>
                <label class="image-field">Hauteur<input id="imageHeight" type="number" min="512" max="1536" step="8" value="1024"></label>
              </div>
            </div>
          </div>
          <div class="image-setting-wrap">
            <button class="pill image-setting-btn" type="button" data-image-popover="style"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18h1.2a2 2 0 0 0 1.4-3.4 1.7 1.7 0 0 1 1.2-2.9H18a3 3 0 0 0 3-3c0-4.8-4-8.7-9-8.7Z"/><path d="M7.5 10h.01M10 6.8h.01M15 7.5h.01M17 11h.01"/></svg><span class="image-setting-label">Style</span><span id="styleSummary">Aucun</span></button>
            <div class="image-popover" id="popover-style" hidden>
              <label class="image-field">Style visuel
                <select id="imageStyle">
                  <option value="none">Aucun style imposé</option><option value="photorealistic">Photorealiste</option>
                  <option value="cinematic">Cinématique</option><option value="3d">Rendu 3D</option>
                  <option value="illustration">Illustration</option><option value="anime">Anime</option>
                  <option value="graphic">Design graphique</option><option value="pixel">Pixel art</option>
                </select>
              </label>
            </div>
          </div>
          <div class="image-setting-wrap">
            <button class="pill image-setting-btn" type="button" data-image-popover="details"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span class="image-setting-label">Détails</span><span id="detailsSummary">Équilibré</span></button>
            <div class="image-popover" id="popover-details" hidden>
              <label class="image-field">Niveau de détail
                <select id="imageSteps"><option value="20">Rapide</option><option value="25" selected>Équilibré</option><option value="30">Détaillé</option></select>
              </label>
              <label class="image-field">Force de modification (référence)
                <input type="range" id="imageDenoise" min="30" max="90" step="5" value="60">
                <span id="denoiseValue">60 %</span>
              </label>
              <label class="image-field">Graine (vide = aléatoire)
                <input type="number" id="imageSeed" min="0" max="2147483647" placeholder="Aléatoire">
              </label>
            </div>
          </div>
          <div class="image-setting-wrap">
            <button class="pill image-setting-btn" id="addImageReference" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 15-5-5L5 20"/></svg><span class="image-setting-label">Référence</span><span id="referenceCount">0</span></button>
          </div>
        </div>
        <div class="reference-previews" id="referencePreviews"></div>
      </section>

      <div class="footer">
        <div class="menu-wrap">
          <button class="pill" id="modelBtn">
            <img class="logo" id="modelLogo" src="assets/qwen.png" alt="" onerror="this.remove()">
            <span id="modelName">qwen2.5vl:3b</span>
            <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="menu" id="menu" hidden></div>
        </div>
        <button class="pill image-mode-btn" id="imageModeBtn" type="button" aria-pressed="false">Générer une image</button>
        <div class="menu-wrap">
          <button class="pill" id="levelBtn" title="Niveau de réflexion">
            <svg class="bars" id="levelBars" viewBox="0 0 16 16"><rect x="1" y="10" width="3" height="5" rx="1"/><rect x="6" y="6" width="3" height="9" rx="1"/><rect x="11" y="2" width="3" height="13" rx="1"/></svg>
            <span id="levelName">Bas</span>
            <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="menu" id="levelMenu" hidden></div>
        </div>
        <div class="spacer"></div>
        <button class="ibtn ghost" id="attach" title="Joindre un fichier">
          <svg viewBox="0 0 24 24"><path d="M21 11.5 12.5 20a5 5 0 0 1-7-7L14 4.5a3.3 3.3 0 0 1 4.7 4.7L10.2 17.7a1.7 1.7 0 0 1-2.4-2.4L15 7.1"/></svg>
        </button>
        <button class="ibtn ghost" id="newchat" title="Nouvelle conversation">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>

      <section class="panel" id="panel">
        <div class="row-line">
          <h3>Paramètres</h3>
          <button class="ibtn ghost" id="closePanel" title="Fermer">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>

        <h3>IA locale · qwen2.5vl:3b</h3>
        <div class="row-line">
          <span id="ollamaStatus" class="muted">Vérification…</span>
          <button class="btn" id="installAI">Installer</button>
        </div>
        <div class="prog" id="ollamaProg"></div>

        <h3>Mises à jour</h3>
        <div class="row-line">
          <span>Version <span id="version">…</span></span>
          <button class="btn" id="checkUpd">Vérifier</button>
        </div>
        <div class="prog" id="updStatus"></div>
        <button class="btn dark" id="restartUpd" hidden>Redémarrer pour installer</button>
        <label class="chk"><input type="checkbox" id="autoUpd"> Mises à jour automatiques</label>

        <h3>Actions sur le PC</h3>
        <label class="chk"><input type="checkbox" id="allowAct"> Autoriser l'IA à proposer des commandes (validation à chaque fois)</label>

        <h3>Recherche web</h3>
        <label class="chk"><input type="checkbox" id="webSearch"> Chercher sur internet avant de répondre</label>
        <label class="image-field">Clé API Brave Search
          <input type="password" id="braveKey" placeholder="BSA…" autocomplete="off" spellcheck="false">
        </label>
      </section>

    </main>
  </div>

  <input type="file" id="file" multiple hidden>
  <input type="file" id="referenceFiles" accept="image/*" multiple hidden>

  <script src="glass.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
