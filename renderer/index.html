<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>OverlayIA</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="stage">
    <main class="card" id="card">
      <div class="chat" id="chat"></div>
      <div class="row">
        <input id="input" type="text" placeholder="Demander n'importe quoi..." autocomplete="off" spellcheck="false" />
        <button class="orb" id="mic" title="Dictée vocale (bientôt)">🎙</button>
      </div>
      <div class="footer">
        <select id="model">
          <option value="gpt-4o-mini">gpt-4o-mini</option>
          <option value="gpt-4o">gpt-4o</option>
        </select>
        <span class="spacer"></span>
        <button class="plus" title="Ajouter">+</button>
        <button class="orb" id="send" title="Envoyer">➤</button>
      </div>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
