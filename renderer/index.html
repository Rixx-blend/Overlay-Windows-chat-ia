<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OverlayIA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <video id="bg" muted playsinline></video>
  <canvas id="glass"></canvas>
  <div id="fps" style="display:none"></div>

  <div class="stage">
    <main class="card" id="card">
      <div class="chat" id="chat"></div>
      <div class="tray" id="tray" hidden></div>

      <div class="row">
        <input id="input" placeholder="Demander n'importe quoi..." autocomplete="off" spellcheck="false">
        <button class="ibtn ghost" id="settingsBtn" title="Paramètres">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <button class="ibtn ghost" id="mic" title="Dicter">
          <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button class="ibtn primary" id="send" title="Envoyer">
          <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>

      <div class="footer">
        <div class="menu-wrap">
          <button class="pill" id="modelBtn">
            <span id="modelName">gpt-4o-mini</span>
            <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="menu" id="menu" hidden></div>
        </div>
        <div class="spacer"></div>
        <button class="ibtn ghost" id="attach" title="Joindre un fichier">
          <svg viewBox="0 0 24 24"><path d="M21 11.5 12.5 20a5 5 0 0 1-7-7L14 4.5a3.3 3.3 0 0 1 4.7 4.7L10.2 17.7a1.7 1.7 0 0 1-2.4-2.4L15 7.1"/></svg>
        </button>
        <button class="ibtn ghost" id="newchat" title="Nouvelle conversation">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>

      <section class="panel" id="panel">
        <div class="row-line">
          <h3>Paramètres</h3>
          <button class="ibtn ghost" id="closePanel" title="Fermer">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>

        <h3>Moteur de chat</h3>
        <div class="seg" id="engineSeg">
          <button data-v="openai">OpenAI</button>
          <button data-v="ollama">IA locale</button>
        </div>

        <h3>Niveau de réflexion</h3>
        <div class="seg" id="levelSeg">
          <button data-v="low">Bas</button>
          <button data-v="high">Haut</button>
          <button data-v="max">Max</button>
        </div>

        <h3>IA locale · qwen2.5vl:3b</h3>
        <div class="row-line">
          <span id="ollamaStatus" class="muted">Vérification…</span>
          <button class="btn" id="installAI">Installer</button>
        </div>
        <div class="prog" id="ollamaProg"></div>

        <h3>Mises à jour</h3>
        <div class="row-line">
          <span>Version <span id="version">…</span></span>
          <button class="btn" id="checkUpd">Vérifier</button>
        </div>
        <div class="prog" id="updStatus"></div>
        <button class="btn dark" id="restartUpd" hidden>Redémarrer pour installer</button>
        <label class="chk"><input type="checkbox" id="autoUpd"> Mises à jour automatiques</label>

        <h3>Actions sur le PC</h3>
        <label class="chk"><input type="checkbox" id="allowAct"> Autoriser l'IA à proposer des commandes (validation à chaque fois)</label>
      </section>
    </main>
  </div>

  <input type="file" id="file" multiple hidden>

  <script src="glass.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
