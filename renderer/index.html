<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OverlayIA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <video id="bg" muted playsinline></video>
  <canvas id="glass"></canvas>
  <div id="fps" style="display:none"></div>

  <div class="stage">
    <main class="card" id="card">
      <div class="chat" id="chat"></div>
      <div class="tray" id="tray" hidden></div>

      <div class="row">
        <input id="input" placeholder="Demander n'importe quoi..." autocomplete="off" spellcheck="false">
        <button class="ibtn ghost" id="imagesBtn" title="Génération d'images SDXL">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
        </button>
        <button class="ibtn ghost" id="settingsBtn" title="Paramètres">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <button class="ibtn ghost" id="mic" title="Dicter">
          <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button class="ibtn primary" id="send" title="Envoyer">
          <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>

      <div class="footer">
        <div class="menu-wrap">
          <button class="pill" id="modelBtn">
            <img class="logo" id="modelLogo" src="assets/qwen.png" alt="" onerror="this.remove()">
            <span id="modelName">qwen2.5vl:3b</span>
            <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="menu" id="menu" hidden></div>
        </div>
        <div class="menu-wrap">
          <button class="pill" id="levelBtn" title="Niveau de réflexion">
            <svg class="bars" id="levelBars" viewBox="0 0 16 16"><rect x="1" y="10" width="3" height="5" rx="1"/><rect x="6" y="6" width="3" height="9" rx="1"/><rect x="11" y="2" width="3" height="13" rx="1"/></svg>
            <span id="levelName">Bas</span>
            <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="menu" id="levelMenu" hidden></div>
        </div>
        <div class="spacer"></div>
        <button class="ibtn ghost" id="attach" title="Joindre un fichier">
          <svg viewBox="0 0 24 24"><path d="M21 11.5 12.5 20a5 5 0 0 1-7-7L14 4.5a3.3 3.3 0 0 1 4.7 4.7L10.2 17.7a1.7 1.7 0 0 1-2.4-2.4L15 7.1"/></svg>
        </button>
        <button class="ibtn ghost" id="newchat" title="Nouvelle conversation">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>

      <section class="panel" id="panel">
        <div class="row-line">
          <h3>Paramètres</h3>
          <button class="ibtn ghost" id="closePanel" title="Fermer">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>

        <h3>IA locale · qwen2.5vl:3b</h3>
        <div class="row-line">
          <span id="ollamaStatus" class="muted">Vérification…</span>
          <button class="btn" id="installAI">Installer</button>
        </div>
        <div class="prog" id="ollamaProg"></div>

        <h3>Mises à jour</h3>
        <div class="row-line">
          <span>Version <span id="version">…</span></span>
          <button class="btn" id="checkUpd">Vérifier</button>
        </div>
        <div class="prog" id="updStatus"></div>
        <button class="btn dark" id="restartUpd" hidden>Redémarrer pour installer</button>
        <label class="chk"><input type="checkbox" id="autoUpd"> Mises à jour automatiques</label>

        <h3>Actions sur le PC</h3>
        <label class="chk"><input type="checkbox" id="allowAct"> Autoriser l'IA à proposer des commandes (validation à chaque fois)</label>
      </section>

      <section class="panel image-panel" id="imagePanel">
        <div class="row-line">
          <h3>Génération d’images · SDXL 1.0</h3>
          <button class="ibtn ghost" id="closeImages" title="Fermer">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="image-engine-row">
          <span id="sdxlStatus" class="muted">Vérification de ComfyUI…</span>
          <button class="btn" id="checkSdxl">Actualiser</button>
        </div>
        <label class="image-label" for="imagePrompt">Prompt</label>
        <textarea id="imagePrompt" maxlength="2000" placeholder="Décris précisément l’image à générer…" rows="4"></textarea>
        <label class="image-label" for="imageNegative">Prompt négatif</label>
        <textarea id="imageNegative" maxlength="1000" placeholder="Éléments à éviter…" rows="2"></textarea>
        <div class="image-options">
          <label>Largeur
            <select id="imageWidth"><option value="1024">1024</option><option value="768">768</option><option value="512">512</option></select>
          </label>
          <label>Hauteur
            <select id="imageHeight"><option value="1024">1024</option><option value="768">768</option><option value="512">512</option></select>
          </label>
          <label>Étapes
            <select id="imageSteps"><option value="25">25</option><option value="20">20</option><option value="30">30</option><option value="35">35</option><option value="40">40</option></select>
          </label>
        </div>
        <button class="btn dark generate-btn" id="generateImage">Générer l’image</button>
        <div class="prog" id="imageProgress" aria-live="polite"></div>
        <div class="image-result" id="imageResult" hidden>
          <div class="image-reveal" id="imageReveal">
            <img id="generatedImage" alt="Image générée avec Stable Diffusion XL">
            <div class="image-pixel-grid" id="imagePixelGrid" aria-hidden="true"></div>
          </div>
          <div class="image-result-footer">
            <span id="imageSavedPath" class="muted"></span>
            <button class="btn" id="openGeneratedImage">Ouvrir</button>
          </div>
        </div>
        <p class="muted image-help">Nécessite ComfyUI lancé sur le port 8188 et le checkpoint sd_xl_base_1.0.safetensors dans models/checkpoints.</p>
      </section>
    </main>
  </div>

  <input type="file" id="file" multiple hidden>

  <script src="glass.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
