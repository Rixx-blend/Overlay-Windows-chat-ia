name: Release
on:
  push:
    branches: [main]

# Empêche plusieurs publications simultanées du même numéro de version.
# Une nouvelle modification de main annule une compilation devenue obsolète.
concurrency:
  group: overlayia-release-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Incrémenter la version (patch)
        shell: bash
        run: |
          npm version patch --no-git-tag-version
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Vérifier la syntaxe JavaScript
        shell: bash
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer/renderer.js
          node --check renderer/glass.js

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'installateur et publier la version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Enregistrer le numéro de version
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Version $VERSION [skip ci]"
          git pull --rebase origin main
          git push
