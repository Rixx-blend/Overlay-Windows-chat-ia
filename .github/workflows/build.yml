name: Build EXE
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PySide6 requests keyboard pyinstaller
      - run: pyinstaller --onefile --windowed --name OverlayIA overlay_ia.py
      - uses: actions/upload-artifact@v4
        with:
          name: OverlayIA
          path: dist/OverlayIA.exe
